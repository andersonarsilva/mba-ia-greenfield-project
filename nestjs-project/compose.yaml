services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot provisioner: creates the bucket, idempotently, before the API/worker start.
  # NOTE: MinIO does not support the `AbortIncompleteMultipartUpload` lifecycle action
  # (S3-only capability — see phase-03-videos/TD-08 Revisions, 2026-08-04). Abandoned
  # multipart uploads are cleaned up exclusively by the SI-03.11 scheduled sweep, which
  # calls AbortMultipartUploadCommand via the SDK — no storage-side lifecycle rule needed.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - STORAGE_BUCKET=streamtube-videos
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamtube streamtube &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET}
      "

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=streamtube
      - RABBITMQ_DEFAULT_PASS=streamtube
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["npm", "run", "start:worker"]
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  minio-data:
  rabbitmq-data:


